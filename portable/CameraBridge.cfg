# Camera Bridge settings
# Stop the camera before editing. Save, then start it again.
# auto selects the first webcam. Or enter its exact name.
camera=auto

# This computer's LAN IP. Example: 192.168.1.2
# auto finds a local network address. Check it in the app.
address=auto
camera_port=18080
preview_port=80

# Camera speed: 1 to 30. Picture quality: 1 to 100.
fps=30
jpeg_quality=85
mirror=false
